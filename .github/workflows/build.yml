name: Build Reels APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Project Files
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/java/com/example/allinonerells

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "AllInOneReels"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.allinonerells'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.allinonerells"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
              implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="All-in-One Download"
                  android:extractNativeLibs="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">
              <FrameLayout
                  android:id="@+id/webViewContainer"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_above="@+id/bottomNav">
                  <WebView android:id="@+id/webYoutube" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="visible" />
                  <WebView android:id="@+id/webFacebook" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" />
                  <WebView android:id="@+id/webInstagram" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" />
              </FrameLayout>
              <com.google.android.material.floatingactionbutton.FloatingActionButton
                  android:id="@+id/fabDownload"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_above="@+id/bottomNav"
                  android:layout_alignParentEnd="true"
                  android:layout_marginEnd="20dp"
                  android:layout_marginBottom="90dp"
                  android:contentDescription="Download Reel"
                  android:src="@android:drawable/stat_sys_download"
                  app:backgroundTint="#E91E63"
                  app:tint="#FFFFFF" />
              <LinearLayout
                  android:id="@+id/bottomNav"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:layout_alignParentBottom="true"
                  android:background="#121212"
                  android:orientation="horizontal"
                  android:weightSum="3">
                  <Button android:id="@+id/btnYoutube" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:background="?android:attr/selectableItemBackground" android:text="YT Shorts" android:textAllCaps="false" android:textColor="#FF0000" android:textStyle="bold" />
                  <Button android:id="@+id/btnFacebook" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:background="?android:attr/selectableItemBackground" android:text="FB Reels" android:textAllCaps="false" android:textColor="#AAAAAA" android:textStyle="bold" />
                  <Button android:id="@+id/btnInstagram" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:background="?android:attr/selectableItemBackground" android:text="Insta Reels" android:textAllCaps="false" android:textColor="#AAAAAA" android:textStyle="bold" />
              </LinearLayout>
          </RelativeLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/allinonerells/MainActivity.kt
          package com.example.allinonerells

          import android.annotation.SuppressLint
          import android.app.AlertDialog
          import android.graphics.Color
          import android.media.MediaScannerConnection
          import android.os.Bundle
          import android.os.Environment
          import android.view.View
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.material.floatingactionbutton.FloatingActionButton
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import java.io.File
          import java.util.concurrent.Executors

          class MainActivity : AppCompatActivity() {
              private lateinit var webYoutube: WebView
              private lateinit var webFacebook: WebView
              private lateinit var webInstagram: WebView
              private lateinit var activeWebView: WebView
              private lateinit var btnYoutube: Button
              private lateinit var btnFacebook: Button
              private lateinit var btnInstagram: Button
              private lateinit var fabDownload: FloatingActionButton
              private val executor = Executors.newSingleThreadExecutor()
              private var isEngineReady = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  webYoutube = findViewById(R.id.webYoutube)
                  webFacebook = findViewById(R.id.webFacebook)
                  webInstagram = findViewById(R.id.webInstagram)
                  btnYoutube = findViewById(R.id.btnYoutube)
                  btnFacebook = findViewById(R.id.btnFacebook)
                  btnInstagram = findViewById(R.id.btnInstagram)
                  fabDownload = findViewById(R.id.fabDownload)

                  executor.execute {
                      try {
                          YoutubeDL.getInstance().init(applicationContext)
                          FFmpeg.getInstance().init(applicationContext)
                          isEngineReady = true
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }

                  setupWebView(webYoutube, "https://m.youtube.com/shorts")
                  setupWebView(webFacebook, "https://m.facebook.com/reel/")
                  setupWebView(webInstagram, "https://www.instagram.com/reels/")
                  activeWebView = webYoutube

                  btnYoutube.setOnClickListener { switchTab(webYoutube, btnYoutube, "#FF0000") }
                  btnFacebook.setOnClickListener { switchTab(webFacebook, btnFacebook, "#1877F2") }
                  btnInstagram.setOnClickListener { switchTab(webInstagram, btnInstagram, "#E1306C") }

                  fabDownload.setOnClickListener {
                      activeWebView.evaluateJavascript("(function() { return window.location.href; })();") { rawUrl ->
                          val currentUrl = rawUrl?.replace("\"", "") ?: ""
                          if (currentUrl.startsWith("http")) {
                              showQualitySelectorDialog(currentUrl)
                          } else {
                              Toast.makeText(this, "ভিডিও লিংক পাওয়া যায়নি!", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun setupWebView(webView: WebView, startUrl: String) {
                  val settings = webView.settings
                  settings.javaScriptEnabled = true
                  settings.domStorageEnabled = true
                  settings.mediaPlaybackRequiresUserGesture = false
                  settings.loadWithOverviewMode = true
                  settings.useWideViewPort = true
                  settings.userAgentString = "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.0.0 Mobile Safari/537.36"

                  val cookieManager = CookieManager.getInstance()
                  cookieManager.setAcceptCookie(true)
                  cookieManager.setAcceptThirdPartyCookies(webView, true)

                  webView.webChromeClient = WebChromeClient()
                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                          val url = request?.url?.toString() ?: return false
                          return !(url.startsWith("http://") || url.startsWith("https://"))
                      }
                  }
                  webView.loadUrl(startUrl)
              }

              private fun switchTab(targetWebView: WebView, activeButton: Button, activeColor: String) {
                  if (activeWebView != targetWebView) {
                      activeWebView.evaluateJavascript("document.querySelectorAll('video').forEach(v => v.pause());", null)
                      activeWebView.visibility = View.GONE
                  }
                  targetWebView.visibility = View.VISIBLE
                  activeWebView = targetWebView

                  btnYoutube.setTextColor(Color.parseColor("#AAAAAA"))
                  btnFacebook.setTextColor(Color.parseColor("#AAAAAA"))
                  btnInstagram.setTextColor(Color.parseColor("#AAAAAA"))
                  activeButton.setTextColor(Color.parseColor(activeColor))
              }

              private fun showQualitySelectorDialog(videoUrl: String) {
                  if (!isEngineReady) {
                      Toast.makeText(this, "ডাউনলোডার ইঞ্জিন প্রস্তুত হচ্ছে, ৫ সেকেন্ড অপেক্ষা করুন...", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val qualities = arrayOf("সেরা কোয়ালিটি (HD)", "মাঝারি কোয়ালিটি (720p)", "কম সাইজ (480p / 360p)")
                  val formatOptions = arrayOf("best[ext=mp4]/best", "best[height<=720][ext=mp4]/best", "best[height<=480][ext=mp4]/best")

                  val builder = AlertDialog.Builder(this)
                  builder.setTitle("ভিডিওর কোয়ালিটি সিলেক্ট করুন")
                  builder.setItems(qualities) { _, which ->
                      startDownloadWithProgress(videoUrl, formatOptions[which])
                  }
                  builder.show()
              }

              private fun startDownloadWithProgress(videoUrl: String, formatOption: String) {
                  val progressDialog = AlertDialog.Builder(this)
                      .setTitle("ডাউনলোড হচ্ছে...")
                      .setMessage("দয়া করে অপেক্ষা করুন, ভিডিও গ্যালারিতে সেভ হচ্ছে...")
                      .setCancelable(false)
                      .create()

                  progressDialog.show()

                  executor.execute {
                      try {
                          val downloadDir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "ReelsHub")
                          if (!downloadDir.exists()) downloadDir.mkdirs()

                          val request = YoutubeDLRequest(videoUrl)
                          request.addOption("-o", downloadDir.absolutePath + "/Reel_%(id)s.%(ext)s")
                          request.addOption("-f", formatOption)
                          request.addOption("--no-check-certificate")
                          request.addOption("--geo-bypass")

                          YoutubeDL.getInstance().execute(request) { progress, etaInSeconds, line ->
                              runOnUiThread {
                                  progressDialog.setMessage("ডাউনলোড হচ্ছে: ${progress.toInt()}% \nবাকি সময়: ${etaInSeconds} সেকেন্ড")
                              }
                          }

                          MediaScannerConnection.scanFile(applicationContext, arrayOf(downloadDir.absolutePath), null, null)

                          runOnUiThread {
                              progressDialog.dismiss()
                              Toast.makeText(this, "ডাউনলোড সম্পন্ন! Downloads/ReelsHub ফোল্ডারে সেভ হয়েছে।", Toast.LENGTH_LONG).show()
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                          runOnUiThread {
                              progressDialog.dismiss()
                              Toast.makeText(this, "ডাউনলোড ব্যর্থ: ${e.localizedMessage}", Toast.LENGTH_LONG).show()
                          }
                      }
                  }
              }

              override fun onBackPressed() {
                  if (activeWebView.canGoBack()) {
                      activeWebView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF

      - name: Download Gradle Binary Manually
        run: |
          wget https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          sudo ln -s $(pwd)/gradle-8.7/bin/gradle /usr/local/bin/gradle

      - name: Build APK with Gradle
        run: gradle :app:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: All-In-One-Reels-APK
          path: app/build/outputs/apk/debug/app-debug.apk
