name: Build Reels APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Project Files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app build.gradle settings.gradle gradle.properties
          cat << 'PROJECT_EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AllInOneReels"
          include ':app'
          PROJECT_EOF
          cat << 'PROJECT_EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          PROJECT_EOF
          cat << 'PROJECT_EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          PROJECT_EOF
          mkdir -p app
          cat << 'PROJECT_EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.allinonerells'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.allinonerells"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
              implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
          }
          PROJECT_EOF
          mkdir -p app/src/main
          cat << 'PROJECT_EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher_foreground"
                  android:label="All-in-One Download"
                  android:extractNativeLibs="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          PROJECT_EOF
          mkdir -p app/src/main/res/drawable
          cat << 'PROJECT_EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#E91E63" android:pathData="M24,24h60v60h-60z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M46,36L46,72L72,54z"/>
          </vector>
          PROJECT_EOF
          mkdir -p app/src/main/res/layout
          cat << 'PROJECT_EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="#000000">
              <FrameLayout android:layout_width="match_parent" android:layout_height="match_parent"
                  android:layout_above="@+id/bottomNav">
                  <WebView android:id="@+id/webYoutube" android:layout_width="match_parent" android:layout_height="match_parent" />
                  <WebView android:id="@+id/webFacebook" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" />
                  <WebView android:id="@+id/webInstagram" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" />
              </FrameLayout>
              <com.google.android.material.floatingactionbutton.FloatingActionButton
                  android:id="@+id/fabDownload" android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:layout_above="@id/bottomNav" android:layout_alignParentEnd="true"
                  android:layout_marginEnd="20dp" android:layout_marginBottom="90dp"
                  android:contentDescription="Download reel or paste link"
                  android:src="@android:drawable/stat_sys_download"
                  app:backgroundTint="#E91E63" app:tint="#FFFFFF" />
              <LinearLayout android:id="@id/bottomNav" android:layout_width="match_parent"
                  android:layout_height="56dp" android:layout_alignParentBottom="true"
                  android:orientation="horizontal" android:background="#121212">
                  <Button android:id="@+id/btnYoutube" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="YT Shorts" android:textAllCaps="false" android:textColor="#FF0000" />
                  <Button android:id="@+id/btnFacebook" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="FB Reels" android:textAllCaps="false" android:textColor="#AAAAAA" />
                  <Button android:id="@+id/btnInstagram" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="Insta Reels" android:textAllCaps="false" android:textColor="#AAAAAA" />
              </LinearLayout>
          </RelativeLayout>
          PROJECT_EOF
                    mkdir -p app/src/main/java/com/example/allinonerells
          cat << 'PROJECT_EOF' > app/src/main/java/com/example/allinonerells/MainActivity.kt
          package com.example.allinonerells

          import android.annotation.SuppressLint
          import android.app.AlertDialog
          import android.content.ContentValues
          import android.graphics.Color
          import android.media.MediaScannerConnection
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.text.InputType
          import android.view.View
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.EditText
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.material.floatingactionbutton.FloatingActionButton
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import org.json.JSONTokener
          import java.io.File
          import java.util.concurrent.Executors

          class MainActivity : AppCompatActivity() {
              private lateinit var youtube: WebView
              private lateinit var facebook: WebView
              private lateinit var instagram: WebView
              private lateinit var active: WebView
              private lateinit var ytButton: Button
              private lateinit var fbButton: Button
              private lateinit var igButton: Button
              private lateinit var downloadButton: FloatingActionButton
              private val executor = Executors.newSingleThreadExecutor()
              private var ready = false
              private var downloading = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  youtube = findViewById(R.id.webYoutube)
                  facebook = findViewById(R.id.webFacebook)
                  instagram = findViewById(R.id.webInstagram)
                  ytButton = findViewById(R.id.btnYoutube)
                  fbButton = findViewById(R.id.btnFacebook)
                  igButton = findViewById(R.id.btnInstagram)
                  downloadButton = findViewById(R.id.fabDownload)
                  active = youtube

                  setup(youtube, "https://m.youtube.com/shorts")
                  setup(facebook, "https://m.facebook.com/reel/")
                  setup(instagram, "https://www.instagram.com/reels/")
                  ytButton.setOnClickListener { switchTo(youtube, ytButton, "#FF0000") }
                  fbButton.setOnClickListener { switchTo(facebook, fbButton, "#1877F2") }
                  igButton.setOnClickListener { switchTo(instagram, igButton, "#E1306C") }
                  downloadButton.setOnClickListener {
                      if (!ready) {
                          toast("ডাউনলোডার এখনও প্রস্তুত নয়। একটু অপেক্ষা করো।")
                      } else if (!downloading) {
                          active.evaluateJavascript("window.location.href") { value ->
                              val url = runCatching {
                                  JSONTokener(value ?: "null").nextValue() as? String
                              }.getOrNull() ?: active.url.orEmpty()
                              showLinkDialog(url)
                          }
                      }
                  }
                  executor.execute {
                      try {
                          YoutubeDL.getInstance().init(applicationContext)
                          FFmpeg.getInstance().init(applicationContext)
                          runOnUiThread { ready = true }
                      } catch (e: Exception) {
                          runOnUiThread {
                              if (!isFinishing && !isDestroyed) {
                                  AlertDialog.Builder(this)
                                      .setTitle("ডাউনলোডার চালু করা যায়নি")
                                      .setMessage(e.localizedMessage ?: "অজানা সমস্যা")
                                      .setPositiveButton("ঠিক আছে", null).show()
                              }
                          }
                      }
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun setup(web: WebView, url: String) {
                  web.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      loadWithOverviewMode = true
                      useWideViewPort = true
                      allowFileAccess = false
                      allowContentAccess = false
                  }
                  CookieManager.getInstance().apply {
                      setAcceptCookie(true)
                      setAcceptThirdPartyCookies(web, true)
                  }
                  web.webChromeClient = WebChromeClient()
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(
                          view: WebView?, request: WebResourceRequest?
                      ): Boolean {
                          val scheme = request?.url?.scheme ?: return false
                          return scheme != "https" && scheme != "http"
                      }
                      override fun onPageFinished(view: WebView?, url: String?) {
                          CookieManager.getInstance().flush()
                      }
                  }
                  web.loadUrl(url)
              }

              private fun switchTo(web: WebView, button: Button, color: String) {
                  if (active != web) {
                      active.evaluateJavascript(
                          "document.querySelectorAll('video').forEach(v => v.pause());", null
                      )
                      active.visibility = View.GONE
                  }
                  web.visibility = View.VISIBLE
                  active = web
                  listOf(ytButton, fbButton, igButton).forEach {
                      it.setTextColor(Color.parseColor("#AAAAAA"))
                  }
                  button.setTextColor(Color.parseColor(color))
              }

              private fun supportedHost(host: String): Boolean = listOf(
                  "facebook.com", "fb.watch", "instagram.com", "youtube.com", "youtu.be"
              ).any { host == it || host.endsWith(".$it") }

              private fun showLinkDialog(current: String) {
                  val input = EditText(this).apply {
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_URI
                      hint = "নির্দিষ্ট ভিডিও বা রিলের লিংক"
                      setText(current)
                      selectAll()
                      setPadding(40, 24, 40, 24)
                  }
                  val dialog = AlertDialog.Builder(this)
                      .setTitle("ভিডিওর লিংক যাচাই করো")
                      .setMessage("ফিডের লিংক হলে রিলের Share → Copy link নিয়ে এখানে পেস্ট করো।")
                      .setView(input)
                      .setNegativeButton("বাতিল", null)
                      .setPositiveButton("পরের ধাপ", null)
                      .create()
                  dialog.setOnShowListener {
                      dialog.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener {
                          val url = input.text.toString().trim()
                          val uri = Uri.parse(url)
                          val host = uri.host?.lowercase().orEmpty()
                          val path = uri.path.orEmpty().lowercase()
                          if (uri.scheme != "https" || !supportedHost(host) ||
                              uri.userInfo != null) {
                              input.error = "YouTube, Facebook বা Instagram-এর HTTPS লিংক দাও"
                          } else if (path.contains("login") || path.contains("checkpoint")) {
                              input.error = "এটি লগইন পেজ। আগে লগইন করে ভিডিওর লিংক দাও।"
                          } else if (path.trim('/') in listOf("", "reel", "reels", "shorts")) {
                              input.error = "এটি ফিডের লিংক। নির্দিষ্ট ভিডিওর Copy link পেস্ট করো।"
                          } else {
                              dialog.dismiss()
                              showQuality(url)
                          }
                      }
                  }
                  dialog.show()
              }

              private fun showQuality(url: String) {
                  val labels = arrayOf("সেরা উপলব্ধ কোয়ালিটি", "সর্বোচ্চ 720p", "সর্বোচ্চ 480p")
                  val formats = arrayOf(
                      "bestvideo+bestaudio/best",
                      "bestvideo[height<=720]+bestaudio/best[height<=720]",
                      "bestvideo[height<=480]+bestaudio/best[height<=480]"
                  )
                  AlertDialog.Builder(this).setTitle("কোয়ালিটি বেছে নাও")
                      .setItems(labels) { _, index -> startDownload(url, formats[index]) }
                      .setNegativeButton("বাতিল", null).show()
              }

              private fun cookieDomain(url: String): String? {
                  val host = Uri.parse(url).host?.lowercase() ?: return null
                  return listOf("facebook.com", "instagram.com", "youtube.com").firstOrNull {
                      host == it || host.endsWith(".$it")
                  }
              }

              private fun createCookies(domain: String?, header: String): File? {
                  if (domain == null || header.isBlank()) return null
                  val rows = header.split(';').mapNotNull { item ->
                      val index = item.indexOf('=')
                      if (index <= 0) return@mapNotNull null
                      val name = item.substring(0, index).trim()
                      val value = item.substring(index + 1).trim()
                      if (name.isBlank() || (name + value).any {
                          it == '\t' || it == '\n' || it == '\r'
                      }) return@mapNotNull null
                      .$domain\tTRUE\t/\tTRUE\t0\t$name\t$value"
                  }
                  if (rows.isEmpty()) return null
                  return File.createTempFile("session_", ".txt", cacheDir).apply {
                      writeText("# Netscape HTTP Cookie File\n" + rows.joinToString("\n") + "\n")
                  }
              }

              private fun startDownload(url: String, format: String) {
                  if (downloading || !ready) return
                  val domain = cookieDomain(url)
                  val header = CookieManager.getInstance().getCookie(url).orEmpty()
                  val userAgent = active.settings.userAgentString
                  downloading = true
                  downloadButton.isEnabled = false
                  val progress = AlertDialog.Builder(this)
                      .setTitle("ডাউনলোড হচ্ছে")
                      .setMessage("ভিডিওর তথ্য নেওয়া হচ্ছে…")
                      .setCancelable(false).create()
                  progress.show()
                  executor.execute {
                      var cookies: File? = null
                      var workDir: File? = null
                      try {
                          workDir = File(cacheDir, "job_${System.nanoTime()}")
                          check(workDir.mkdirs()) { "অস্থায়ী ফোল্ডার তৈরি করা যায়নি" }
                          cookies = createCookies(domain, header)
                          val request = YoutubeDLRequest(url)
                          request.addOption("-o", File(workDir, "Reel_%(id)s.%(ext)s").absolutePath)
                          request.addOption("-f", format)
                          request.addOption("--merge-output-format", "mp4")
                          request.addOption("--no-playlist")
                          request.addOption("--ignore-config")
                          request.addOption("--user-agent", userAgent)
                          cookies?.let { request.addOption("--cookies", it.absolutePath) }
                          YoutubeDL.getInstance().execute(request) { percent, eta, _ ->
                              runOnUiThread {
                                  if (!isFinishing && !isDestroyed) {
                                      progress.setMessage("ডাউনলোড: ${percent.toInt().coerceIn(0, 100)}%\nআনুমানিক বাকি: $eta সেকেন্ড")
                                  }
                              }
                          }
                          val outputs = workDir.listFiles().orEmpty().filter {
                              it.isFile && it.extension.lowercase() in listOf("mp4", "webm", "mkv", "mov", "m4v")
                          }
                          check(outputs.isNotEmpty()) { "ডাউনলোডের পর ভিডিও ফাইল পাওয়া যায়নি" }
                          outputs.forEach { saveVideo(it) }
                          runOnUiThread {
                              if (!isFinishing && !isDestroyed) {
                                  val location = if (Build.VERSION.SDK_INT >= 29)
                                      "Downloads/ReelsHub" else "অ্যাপের Movies/ReelsHub ফোল্ডার"
                                  AlertDialog.Builder(this).setTitle("ডাউনলোড সম্পন্ন")
                                      .setMessage("${outputs.size}টি ভিডিও সেভ হয়েছে।\n$location")
                                      .setPositiveButton("ঠিক আছে", null).show()
                              }
                          }
                      } catch (e: Exception) {
                          val detail = e.localizedMessage.orEmpty()
                          val explanation = if (detail.contains("login", true) ||
                              detail.contains("checkpoint", true)) {
                              "ফেসবুক/ইনস্টাগ্রামে অ্যাপের ভেতর লগইন করে নির্দিষ্ট ভিডিওর লিংক দিয়ে আবার চেষ্টা করো। লগইন থাকলেও সাইট request আটকাতে পারে।"
                          } else {
                              "লিংক, ভিডিওর অ্যাক্সেস এবং নেটওয়ার্ক পরীক্ষা করো। সাইটের পরিবর্তনে extractor-ও ব্যর্থ হতে পারে।"
                          }
                          runOnUiThread {
                              if (!isFinishing && !isDestroyed) {
                                  AlertDialog.Builder(this).setTitle("ডাউনলোড ব্যর্থ")
                                      .setMessage(explanation + "\n\n" + detail.take(3500))
                                      .setPositiveButton("ঠিক আছে", null).show()
                              }
                          }
                      } finally {
                          cookies?.delete()
                          workDir?.deleteRecursively()
                          runOnUiThread {
                              downloading = false
                              if (!isDestroyed) {
                                  progress.dismiss()
                                  downloadButton.isEnabled = true
                              }
                          }
                      }
                  }
              }

              private fun saveVideo(source: File) {
                  val name = "Reel_${System.currentTimeMillis()}_${System.nanoTime()}.${source.extension}"
                  val mime = when (source.extension.lowercase()) {
                      "webm" -> "video/webm"
                      "mkv" -> "video/x-matroska"
                      "mov" -> "video/quicktime"
                      else -> "video/mp4"
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      val values = ContentValues().apply {
                          put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                          put(MediaStore.MediaColumns.MIME_TYPE, mime)
                          put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/ReelsHub")
                          put(MediaStore.MediaColumns.IS_PENDING, 1)
                      }
                      val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                          ?: error("Downloads-এ ফাইল তৈরি করা যায়নি")
                      try {
                          val output = contentResolver.openOutputStream(uri)
                              ?: error("ফাইলে লেখার অনুমতি পাওয়া যায়নি")
                          output.use { out -> source.inputStream().use { it.copyTo(out) } }
                          val complete = ContentValues().apply {
                              put(MediaStore.MediaColumns.IS_PENDING, 0)
                          }
                          check(contentResolver.update(uri, complete, null, null) > 0) {
                              "সেভ করা ফাইল প্রকাশ করা যায়নি"
                          }
                      } catch (e: Exception) {
                          contentResolver.delete(uri, null, null)
                          throw e
                      }
                  } else {
                      val base = getExternalFilesDir(Environment.DIRECTORY_MOVIES)
                          ?: error("বাইরের স্টোরেজ পাওয়া যায়নি")
                      val folder = File(base, "ReelsHub")
                      check(folder.exists() || folder.mkdirs()) { "সেভ করার ফোল্ডার তৈরি করা যায়নি" }
                      val target = File(folder, name)
                      source.copyTo(target, overwrite = false)
                      MediaScannerConnection.scanFile(this, arrayOf(target.absolutePath), arrayOf(mime), null)
                  }
              }

              private fun toast(text: String) = Toast.makeText(this, text, Toast.LENGTH_LONG).show()

              @Deprecated("Legacy back navigation")
              override fun onBackPressed() {
                  if (downloading) {
                      toast("ডাউনলোড শেষ হওয়া পর্যন্ত অ্যাপ খোলা রাখো।")
                  } else if (active.canGoBack()) {
                      active.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }

              override fun onDestroy() {
                  executor.shutdown()
                  super.onDestroy()
              }
          }
          PROJECT_EOF

      - name: Build APK with Gradle
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: All-In-One-Reels-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
