name: Build Reels APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Complete Android Project
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/java/com/example/allinonerells

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "AllInOneReels"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.allinonerells'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.allinonerells"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
              implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="All-in-One Download"
                  android:extractNativeLibs="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">
              <FrameLayout
                  android:id="@+id/webViewContainer"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_above="@+id/bottomNav">
                  <WebView android:id="@+id/webYoutube" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="visible" />
                  <WebView android:id="@+id/webFacebook" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" />
                  <WebView android:id="@+id/webInstagram" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" />
              </FrameLayout>
              <com.google.android.material.floatingactionbutton.FloatingActionButton
                  android:id="@+id/fabDownload"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_above="@+id/bottomNav"
                  android:layout_alignParentEnd="true"
                  android:layout_marginEnd="20dp"
                  android:layout_marginBottom="90dp"
                  android:contentDescription="Download Reel"
                  android:src="@android:drawable/stat_sys_download"
                  app:backgroundTint="#E91E63"
                  app:tint="#FFFFFF" />
              <LinearLayout
                  android:id="@+id/bottomNav"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:layout_alignParentBottom="true"
                  android:background="#121212"
                  android:orientation="horizontal"
                  android:weightSum="3">
                  <Button android:id="@+id/btnYoutube" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:background="?android:attr/selectableItemBackground" android:text="YT Shorts" android:textAllCaps="false" android:textColor="#FF0000" android:textStyle="bold" />
                  <Button android:id="@+id/btnFacebook" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:background="?android:attr/selectableItemBackground" android:text="FB Reels" android:textAllCaps="false" android:textColor="#AAAAAA" android:textStyle="bold" />
                  <Button android:id="@+id/btnInstagram" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:background="?android:attr/selectableItemBackground" android:text="Insta Reels" android:textAllCaps="false" android:textColor="#AAAAAA" android:textStyle="bold" />
              </LinearLayout>
          </RelativeLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/allinonerells/MainActivity.kt
